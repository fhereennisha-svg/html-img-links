<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }

        .coding-image {
            display: block;
            width: 500px;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
        }

        .html-link {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Web Development</h1>

    <h2>HTML - The Structure</h2>

    <p>
        HTML stands for HyperText Markup Language. It provides the structure
        and content of a webpage.
    </p>

    <p>
        HTML uses elements such as headings, paragraphs, images and links
        to organise information on a webpage.
    </p>

    <img
        class="coding-image"
        src="./images/html-coding.jpg"
        alt="Person using a laptop displaying HTML code"
    >

    <p>
        <a
            class="html-link"
            href="https://developer.mozilla.org/en-US/docs/Web/HTML"
            target="_blank"
            rel="noopener noreferrer"
        >
            Learn more about HTML
        </a>
    </p>
</body>

</html>
